[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agent"
version = "0.1.0"
description = "招聘自动化系统 greenfield 重构：FastAPI + LangGraph 控制面与 worker。"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "playwright>=1.45.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
  "PyYAML>=6.0.0",
  "openai>=1.40.0",
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.4.0",
  "ruff>=0.6.0",
  "pytest>=8.3.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "data*", "frontend*", "scripts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
